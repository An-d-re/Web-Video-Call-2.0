<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>影音视界 · 房间视频通话</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-raised: #1f1f23;
            --surface-hover: #27272a;
            --orange: #f97316;
            --orange-hover: #ea580c;
            --orange-soft: rgba(249, 115, 22, 0.10);
            --orange-glow: rgba(249, 115, 22, 0.20);
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: #27272a;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --radius-sm: 0.75rem;
            --radius: 1rem;
            --radius-lg: 1.5rem;
            --radius-xl: 2rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(249, 115, 22, 0.04) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 100%, rgba(249, 115, 22, 0.03) 0%, transparent 50%);
        }

        .call-container {
            max-width: 1100px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2rem 2rem 1.6rem;
            box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.04),
                        0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.6rem;
        }
        .header .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 8px var(--orange-glow);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .header .dot:nth-child(2) { animation-delay: 0.3s; }
        .header .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text);
            margin: 0 0.4rem;
        }
        .header h1 span { color: var(--orange); }

        /* ===== Room Bar ===== */
        .room-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.8rem;
        }
        .room-bar input {
            padding: 0.65rem 1.1rem;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            outline: none;
            width: 180px;
            letter-spacing: 0.08em;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }
        .room-bar input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px var(--orange-soft);
        }
        .room-bar input::placeholder {
            color: var(--text-muted);
            letter-spacing: 0;
            text-transform: none;
            font-family: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        }

        .btn {
            border: 1px solid var(--border);
            padding: 0.65rem 1.3rem;
            border-radius: var(--radius-xl);
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--surface-raised);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            white-space: nowrap;
            user-select: none;
        }
        .btn:hover:not(:disabled) {
            background: var(--surface-hover);
            transform: translateY(-1px);
        }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: var(--orange);
            border-color: var(--orange);
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--orange-hover);
            border-color: var(--orange-hover);
            box-shadow: 0 4px 14px var(--orange-glow);
        }

        /* ===== Room Info ===== */
        .room-info {
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-xl);
            display: inline-block;
            width: 100%;
            letter-spacing: 0.03em;
            border: 1px solid var(--border);
        }
        .room-info .room-id {
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            color: var(--orange);
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        /* ===== Video Grid ===== */
        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.4rem;
        }
        .video-card {
            flex: 1;
            min-width: 280px;
            max-width: 520px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }
        .video-card.connected { border-color: rgba(249, 115, 22, 0.3); }

        .video-wrapper {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #localVideo { transform: scaleX(-1); }
        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #d4d4d8;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ===== Remote Mic Badge ===== */
        .mic-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: none;
            align-items: center;
            gap: 4px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 500;
            color: #fff;
            z-index: 4;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .mic-badge.active { display: inline-flex; }
        .mic-badge svg { width: 13px; height: 13px; stroke: #fff; }

        /* ===== Video Overlay ===== */
        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(24, 24, 27, 0.94);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 3;
        }
        .video-overlay.active { opacity: 1; }
        .video-overlay svg {
            width: 56px;
            height: 56px;
            stroke: var(--text-muted);
            opacity: 0.45;
            margin-bottom: 10px;
        }
        .video-overlay span {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ===== Idle Overlay ===== */
        .idle-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.82rem;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(24,24,27,0.6) 0%, transparent 70%);
        }

        /* ===== Button Bar ===== */
        .button-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 1rem;
        }
        .button-row {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
        }

        .btn-control {
            width: 150px;
            justify-content: center;
            padding: 0.7rem 1rem;
            border-radius: var(--radius);
            font-weight: 500;
            gap: 0.5rem;
        }
        .btn-control svg { width: 18px; height: 18px; flex-shrink: 0; }

        .btn-control.on {
            background: var(--surface-raised);
            border-color: var(--border);
            color: var(--text);
        }
        .btn-control.on svg { stroke: var(--orange); }
        .btn-control.on:hover:not(:disabled) { border-color: var(--orange); }

        .btn-control.off {
            background: var(--orange);
            border-color: var(--orange);
            color: #fff;
        }
        .btn-control.off svg { stroke: #fff; }
        .btn-control.off:hover:not(:disabled) {
            background: #fb923c;
        }

        .btn-hangup {
            padding: 0.7rem 2.5rem;
            border-radius: var(--radius);
            background: var(--danger);
            border: 1px solid var(--danger);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            justify-content: center;
        }
        .btn-hangup:hover:not(:disabled) {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }

        .btn-leave {
            padding: 0.7rem 1.6rem;
            border-radius: var(--radius);
            background: var(--surface-raised);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            justify-content: center;
        }
        .btn-leave:hover:not(:disabled) { border-color: var(--danger); color: #fca5a5; }

        /* ===== Status Area ===== */
        .status-area { text-align: center; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.82rem;
            color: #a3e635;
            border: 1px solid var(--border);
        }
        .status-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #a3e635;
            flex-shrink: 0;
        }
        .status-badge.error { color: #fca5a5; }
        .status-badge.error::before { background: #fca5a5; }
        .ice-info {
            font-size: 0.7rem;
            margin-top: 8px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        /* ===== User Bar ===== */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            margin-bottom: 0.9rem;
            padding: 0.4rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .user-bar strong { color: var(--text); font-weight: 600; }
        .btn-logout {
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            border-radius: var(--radius-xl);
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .2s ease;
            font-family: inherit;
        }
        .btn-logout:hover { border-color: var(--danger); color: #fca5a5; }

        /* ===== Layout: Sidebar + Main ===== */
        /* 覆盖 body 原来的居中布局：现在左栏 + 右侧主区 */
        body { display: block; padding: 0; }
        .app { display: flex; width: 100%; min-height: 100vh; }
        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px; min-width: 0; }

        .sidebar {
            width: 288px;
            flex: 0 0 288px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .sidebar-head {
            padding: 1rem 0.9rem 0.7rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.7rem;
        }
        .sidebar-title h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .btn-new {
            border: 1px solid var(--orange);
            background: var(--orange);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.32rem 0.7rem;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-family: inherit;
            transition: all .2s ease;
            white-space: nowrap;
        }
        .btn-new:hover { background: var(--orange-hover); border-color: var(--orange-hover); }

        .side-tabs { display: flex; gap: 0.35rem; }
        .side-tab {
            flex: 1;
            padding: 0.4rem 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-family: inherit;
            transition: all .2s ease;
        }
        .side-tab.active {
            background: var(--orange-soft);
            border-color: rgba(249, 115, 22, 0.5);
            color: var(--orange);
            font-weight: 600;
        }

        .room-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 0.6rem 0.6rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .room-item {
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .room-item:hover { border-color: var(--orange); background: var(--surface-hover); }
        .room-item-head {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.25rem;
        }
        .room-item-title {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .room-lock { font-size: 0.75rem; flex-shrink: 0; }
        /* 解散按钮：只对创建者显示，压在标题右侧 */
        .room-del {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            padding: 0;
            line-height: 1;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all .2s ease;
        }
        .room-del:hover {
            border-color: var(--danger);
            color: #fca5a5;
            background: rgba(239, 68, 68, .12);
        }
        .room-item-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .room-item.live { border-color: rgba(163, 230, 53, 0.35); }
        .room-empty {
            padding: 1.2rem 0.8rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .sidebar-toggle { display: none; }

        /* ===== Modal ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.4rem 1.3rem 1.2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        .modal h3 { font-size: 0.95rem; margin-bottom: 0.9rem; color: var(--text); }
        .modal label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 0.6rem 0 0.3rem;
        }
        .modal input {
            width: 100%;
            padding: 0.55rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }
        .modal input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
        .modal .hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.25rem; }
        .modal-msg {
            min-height: 1.1em;
            font-size: 0.75rem;
            color: #fca5a5;
            margin-top: 0.6rem;
            line-height: 1.4;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1rem;
        }
        .modal-actions button {
            padding: 0.5rem 1.1rem;
            border-radius: 0.7rem;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
            border: 1px solid var(--border);
            background: var(--surface-raised);
            color: var(--text);
            transition: all .2s ease;
        }
        .modal-actions .primary {
            background: var(--orange);
            border-color: var(--orange);
            color: #fff;
            font-weight: 600;
        }
        .modal-actions .primary:hover:not(:disabled) { background: var(--orange-hover); }
        .modal-actions button:disabled { opacity: .5; cursor: not-allowed; }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                z-index: 60;
                transform: translateX(-100%);
                transition: transform .25s ease;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle {
                display: inline-flex;
                position: fixed;
                left: 12px; top: 12px;
                z-index: 70;
                align-items: center;
                gap: 0.3rem;
                padding: 0.45rem 0.85rem;
                font-size: 0.78rem;
                border-radius: var(--radius-xl);
                background: var(--surface);
                border: 1px solid var(--border);
                color: var(--text);
                cursor: pointer;
                font-family: inherit;
            }
            .main { padding: 60px 12px 12px; }
        }

        @media (max-width: 700px) {
            body { padding: 0; }
            .call-container { padding: 1.2rem 0.8rem 1rem; border-radius: var(--radius-lg); }
            .video-card { min-width: 100%; }
            .header h1 { font-size: 1rem; }
            .btn-control { width: 130px; font-size: 0.8rem; padding: 0.6rem 0.8rem; }
            .room-bar input { width: 140px; }
        }
    </style>
</head>
<body>
<button class="sidebar-toggle" id="sidebarToggle" type="button">☰ 房间</button>

<div class="app">
<aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
        <div class="sidebar-title">
            <h2>房间</h2>
            <button class="btn-new" id="newRoomBtn" type="button">+ 新建</button>
        </div>
        <div class="side-tabs">
            <button class="side-tab active" id="tabActive" type="button">活跃房间</button>
            <button class="side-tab" id="tabMine" type="button">我的房间</button>
        </div>
    </div>
    <ul class="room-list" id="roomList"></ul>
</aside>

<main class="main">
<div class="call-container">

    <!-- User Bar -->
    <div class="user-bar">
        <span>已登录：<strong id="userName">—</strong></span>
        <button class="btn-logout" id="logoutBtn" type="button">退出登录</button>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <h1>影音<span>视界</span></h1>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <!-- Room Bar -->
    <div class="room-bar">
        <button class="btn btn-primary" id="createBtn">创建房间</button>
        <input type="text" id="roomIdInput" placeholder="输入房间号" maxlength="6" autocomplete="off" />
        <button class="btn btn-primary" id="joinBtn">加入房间</button>
    </div>

    <!-- Room Info -->
    <div class="room-info" id="roomStatus">未加入房间</div>

    <!-- Video Grid -->
    <div class="video-grid">
        <div class="video-card" id="localCard">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-overlay" id="localOverlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
                    </svg>
                    <span>摄像头已关闭</span>
                </div>
                <div class="idle-hint" id="localIdleHint">摄像头未开启</div>
                <div class="video-label" id="localLabel">本地</div>
            </div>
        </div>

        <div class="video-card" id="remoteCard">
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-overlay" id="remoteOverlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
                    </svg>
                    <span>对方已关闭摄像头</span>
                </div>
                <div class="idle-hint" id="remoteIdleHint">等待加入房间...</div>

<script src="js/auth.js"></script>
<script>
    // ========== State ==========
    let localStream = new MediaStream();   // 本地音视频轨道容器，按需填充
    let peerConn = null;
    let ws = null;
    let inCall = false;
    let currentRoomId = null;       // 服务端已通过 joined 确认的房间号
    let currentRoomTitle = '';      // 房间标题（来自 auth 服务）
    let currentRoomPassword = '';   // 记住本次进房用的密码，重连时复用
    let pendingRoomToken = null;    // 已拿到、待发给信令服务的进房凭证
    let pendingRoomTitle = '';      // 待展示的房间标题
    let audioMuted = true;      // 初始未开启
    let videoMuted = true;      // 初始未开启
    let micStarted = false;     // 是否已获取过麦克风设备
    let videoStarted = false;   // 是否已获取过摄像头设备
    let remoteVideoMuted = false;
    let remoteHasVideo = false; // 对方是否发来过视频轨道
    let remoteMicMuted = false;    // 对方当前是否停止发送音频
    let remoteMicStarted = false;  // 对方是否获取过麦克风设备（区分"未开启"与"已关闭"）
    let isInitiator = false;
    let isPolite = false;       // perfect negotiation：响应方在协商冲突时让步
    let audioSender = null;
    let makingOffer = false;
    let ignoreOffer = false;
    let wsDisconnectedIntentionally = false;
    let byeSent = false;
    let wsReconnectAttempts = 0;
    let authed = false;             // 本条 WS 连接是否已通过 auth 鉴权
    let reconnectTimer = null;      // 待执行的重连定时器（单例，防止重连叠加出多个 socket）
    let connectPromise = null;      // 进行中的建连流程（单飞，防止并发建连）
    let iceRestartTimer = null;
    const WS_MAX_RECONNECT = 10;
    const WS_RECONNECT_BASE = 1000;

    let ICE_CONFIG = {
        iceServers: [
            { urls: "stun:stun.qq.com:3478" },
            { urls: "stun:stun.miwifi.com:3478" }
        ]
    };

    // ========== DOM refs ==========
    const $ = (id) => document.getElementById(id);

    // ========== UI helpers ==========
    function updateStatus(msg, isError = false) {
        const el = $('status');
        el.textContent = msg;
        el.className = 'status-badge' + (isError ? ' error' : '');
    }

    function updateMicUI() {
        const btn = $('micBtn');
        const label = $('micLabel');
        const iconOn = btn.querySelector('.icon-on');
        const iconOff = btn.querySelector('.icon-off');
        if (audioMuted) {
            btn.className = 'btn btn-control off';
            label.textContent = '打开麦克风';
            iconOn.style.display = 'none';
            iconOff.style.display = 'block';
        } else {
            btn.className = 'btn btn-control on';
            label.textContent = '关闭麦克风';
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
        }
    }

    function updateVideoUI() {
        const btn = $('videoBtn');
        const label = $('videoLabel');
        const iconOn = btn.querySelector('.icon-on');
        const iconOff = btn.querySelector('.icon-off');
        if (videoMuted) {
            btn.className = 'btn btn-control off';
            label.textContent = '开启摄像头';
            iconOn.style.display = 'none';
            iconOff.style.display = 'block';
        } else {
            btn.className = 'btn btn-control on';
            label.textContent = '关闭摄像头';
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
        }
        if (!videoStarted) {
            // 从未开启过：显示提示，不显示"已关闭"遮罩
            $('localOverlay').classList.remove('active');
            $('localIdleHint').style.display = '';
        } else {
            $('localOverlay').classList.toggle('active', videoMuted);
            $('localIdleHint').style.display = 'none';
        }
        $('localCard').classList.toggle('connected', videoStarted && !videoMuted);
    }

    function updateRemoteVideoUI() {
        $('remoteOverlay').classList.toggle('active', remoteHasVideo && remoteVideoMuted);
        if (!remoteHasVideo) {
            $('remoteIdleHint').textContent = inCall ? '对方未开启摄像头' : '等待加入房间...';
            $('remoteIdleHint').style.display = '';
        } else {
            $('remoteIdleHint').style.display = 'none';
        }
    }

    // 远端麦克风标识：只有"已拿到设备但停止发送"才显示"已静音"；
    // 从未获取过设备属于"未开启"，与"已关闭"是两个不同状态（见 CONTEXT.md）
    function updateRemoteMicUI() {
        $('remoteMicBadge').classList.toggle('active',
            inCall && remoteMicStarted && remoteMicMuted);
    }

    // 远端面板整体刷新
    function updateRemoteUI() {
        updateRemoteVideoUI();
        updateRemoteMicUI();
    }

    // 上报本端媒体状态（视频 + 麦克风）。
    // 服务端在同一个 join_room 处理里已经把 start_call 发给双方，顺序有保证，
    // 所以这里可以立即上报，不需要再靠 300ms 延时兜底。
    function sendMediaState() {
        if (!ws || ws.readyState !== WebSocket.OPEN || !inCall) return;
        ws.send(JSON.stringify({ type: "video_mute", muted: videoMuted }));
        ws.send(JSON.stringify({ type: "mic_mute", muted: audioMuted, started: micStarted }));
    }

    // 房间号现在由服务端生成（见 auth 服务的 generateRoomID），前端不再自己造号。

    // ========== WebRTC ==========
    function initPeerConnection() {
        if (peerConn) {
            peerConn.close();
            peerConn = null;
        }
        audioSender = null;

        peerConn = new RTCPeerConnection(ICE_CONFIG);

        // 已有轨道直接加入；通话中新增的轨道由 toggle 函数负责
        localStream.getTracks().forEach(track => {
            track.enabled = (track.kind === 'audio') ? !audioMuted : !videoMuted;
            const sender = peerConn.addTrack(track, localStream);
            if (track.kind === 'audio') {
                audioSender = sender;
            }
        });

        // perfect negotiation：任何轨道变化都由这里统一发起协商
        peerConn.onnegotiationneeded = async () => {
            if (!inCall || !ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                makingOffer = true;
                const offer = await peerConn.createOffer();
                await peerConn.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: "offer", data: peerConn.localDescription }));
            } catch (e) {
                console.error("发起协商失败", e);
            } finally {
                makingOffer = false;
            }
        };

        peerConn.ontrack = (event) => {
            if (event.track.kind === 'video') {
                remoteHasVideo = true;
            }
            $('remoteVideo').srcObject = event.streams[0] || new MediaStream([event.track]);
            $('remoteCard').classList.add('connected');
            updateRemoteVideoUI();
            updateStatus("通话中");
        };

        peerConn.onicecandidate = (event) => {
            if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "ice", data: event.candidate }));
            }
        };

        peerConn.oniceconnectionstatechange = () => {
            const state = peerConn ? peerConn.iceConnectionState : 'closed';
            $('iceStatus').textContent = `ICE 状态: ${state}`;
            if (state === 'connected' || state === 'completed') {
                updateStatus("通话中");
                document.title = "通话中 - 影音视界";
                if (iceRestartTimer) { clearTimeout(iceRestartTimer); iceRestartTimer = null; }
            } else if (state === 'disconnected') {
                updateStatus("连接不稳定...", true);
                if (!iceRestartTimer) {
                    iceRestartTimer = setTimeout(() => {
                        if (peerConn && peerConn.iceConnectionState === 'disconnected') {
                            attemptIceRestart();
                        }
                    }, 5000);
                }
            } else if (state === 'failed') {
                updateStatus("ICE 连接失败，尝试重启...", true);
                attemptIceRestart();
            }
        };

        return peerConn;
    }

    async function attemptIceRestart() {
        if (!peerConn || !inCall || !ws || ws.readyState !== WebSocket.OPEN) return;
        if (peerConn.signalingState !== 'stable' || makingOffer) return;  // 有协商正在进行，等状态变化后重试
        iceRestartTimer = null;
        try {
            makingOffer = true;
            const offer = await peerConn.createOffer({ iceRestart: true });
            await peerConn.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "offer", data: peerConn.localDescription }));
            updateStatus("正在重新连接...");
        } catch(e) {
            updateStatus("ICE 重启失败，请尝试重新加入房间", true);
        } finally {
            makingOffer = false;
        }
    }

    // ========== Signaling ==========
    async function handleSignaling(event) {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch(e) {
            console.error("JSON parse error", event.data);
            return;
        }

        if (data.type === "auth_ok") {
            authed = true;
            console.log("鉴权成功:", data);
            if (data.displayName) $('userName').textContent = data.displayName;
            else if (data.username) $('userName').textContent = data.username;
            if (data.displayName) $('localLabel').textContent = data.displayName + '（我）';
            updateStatus("已登录，可以创建或加入房间");

            // 鉴权通过后补发入房：
            //  - 已有待发的进房凭证 → 直接发（首次入房的正常路径）
            //  - 只是重连回来（凭证可能已过期）→ 重新向 auth 换一张
            if (pendingRoomToken) {
                sendJoinRoom();
            } else if (currentRoomId && !byeSent) {
                rejoinCurrentRoom();
            }

            // 鉴权完成后开始刷新房间列表
            startRoomPolling();
            return;
        }

        if (data.type === "live_rooms") {
            roomData.live = {};
            const list = data.rooms || [];
            for (let i = 0; i < list.length; i++) {
                roomData.live[list[i].roomId] = list[i].peers || 0;
            }
            renderRoomList();
            return;
        }

        if (data.type === "joined") {
            // 服务端确认入房：到这一步才认为"真的在房间里"
            pendingRoomToken = null;
            currentRoomId = data.roomId;
            currentRoomTitle = pendingRoomTitle || currentRoomTitle;
            pendingRoomTitle = '';
            byeSent = false;
            setRoomStatus(currentRoomTitle, currentRoomId);
            if (data.self && data.self.displayName) {
                $('localLabel').textContent = data.self.displayName + '（我）';
                $('userName').textContent = data.self.displayName;
            }
            $('leaveBtn').disabled = false;

            // 关键：inCall 表示房间里已经凑满 2 人（通话正在进行），
            // 不能把状态打回"等待对方"。
            if (data.inCall) {
                updateStatus("通话中");
            } else {
                updateStatus("已加入房间，等待对方...");
            }
            refreshRooms();
            return;
        }

        if (data.type === "start_call") {
            console.log("收到 start_call:", JSON.stringify(data));
            if (data.iceServers && Array.isArray(data.iceServers)) {
                ICE_CONFIG.iceServers = data.iceServers;
                console.log("已更新 ICE 配置:", JSON.stringify(ICE_CONFIG.iceServers));
            }
            // 显示对方真实姓名
            if (data.peer) {
                const name = data.peer.displayName || data.peer.username;
                if (name) $('remoteLabel').textContent = name;
            }
            isInitiator = data.initiator === true;
            isPolite = !isInitiator;   // 响应方在协商冲突时让步
            byeSent = false;           // 新一次通话开始，清掉上一轮的挂断标记
            inCall = true;
            remoteHasVideo = false;
            remoteVideoMuted = false;
            remoteMicMuted = false;
            remoteMicStarted = false;
            if (!peerConn) initPeerConnection();   // 已有轨道会自动触发一次协商
            $('hangupBtn').disabled = false;
            updateRemoteUI();
            updateStatus("通话中");
            sendMediaState();          // 立刻上报本端媒体状态（服务端保证晚于 start_call 到达对端）
            return;
        }

        if (data.type === "offer") {
            if (!peerConn) initPeerConnection();
            const offerCollision = makingOffer || peerConn.signalingState !== "stable";
            ignoreOffer = !isPolite && offerCollision;
            if (ignoreOffer) {
                console.log("协商冲突：作为发起方忽略对方的 offer");
                return;
            }
            try {
                if (offerCollision) {
                    // 让步方：放弃自己的 offer，接受对方的
                    await Promise.all([
                        peerConn.setLocalDescription({ type: "rollback" }),
                        peerConn.setRemoteDescription(data.data)
                    ]);
                } else {
                    await peerConn.setRemoteDescription(data.data);
                }
                const answer = await peerConn.createAnswer();
                await peerConn.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: "answer", data: answer }));
                inCall = true;
                $('hangupBtn').disabled = false;
                updateStatus("通话中");
                sendMediaState();
            } catch(e) {
                console.error("处理 offer 失败", e);
            }
        } else if (data.type === "answer") {
            if (!peerConn || peerConn.signalingState !== "have-local-offer") {
                console.warn("忽略状态不匹配的 answer，当前状态:", peerConn ? peerConn.signalingState : "无连接");
                return;
            }
            try {
                await peerConn.setRemoteDescription(data.data);
            } catch(e) {
                console.error("处理 answer 失败", e);
                return;
            }
            inCall = true;
            $('hangupBtn').disabled = false;
            updateStatus("通话中");
            sendMediaState();
        } else if (data.type === "ice") {
            if (peerConn) {
                try {
                    await peerConn.addIceCandidate(data.data);
                } catch(e) { console.warn("ICE candidate error", e); }
            }
        } else if (data.type === "video_mute") {
            remoteVideoMuted = data.muted === true;
            updateRemoteUI();
        } else if (data.type === "mic_mute") {
            remoteMicMuted = data.muted === true;
            remoteMicStarted = data.started === true;
            updateRemoteUI();
        } else if (data.type === "bye") {
            // 对方挂断/退出：只结束本次通话，自己仍然留在房间里等待
            byeSent = true;
            endCall();
            $('leaveBtn').disabled = false;
            updateStatus("对方已挂断，可以继续等待，或点「退出房间」离开");
        } else if (data.type === "bye_ack" || data.type === "left_room") {
            console.log("服务端已确认离开房间");
        } else if (data.type === "error") {
            // ---- 鉴权类错误：先尝试刷新令牌，失败则回登录页 ----
            if (data.code === "invalid_token" || data.code === "auth_timeout" ||
                data.code === "unauthorized") {
                authed = false;
                updateStatus("登录状态已失效，正在重新鉴权…", true);
                Auth.refresh().then((ok) => {
                    if (ok && ws) {
                        // 令牌换新了：直接在当前连接上重新鉴权，auth_ok 后会自动补发入房
                        sendAuth();
                    } else {
                        gotoLogin();
                    }
                });
                return;
            }

            // ---- 进房凭证无效/过期：重新向 auth 换一张再试 ----
            if (data.code === "invalid_room_token") {
                pendingRoomToken = null;
                updateStatus("进房凭证已过期，正在重新获取…", true);
                rejoinCurrentRoom();
                return;
            }

            // ---- 其它错误 ----
            pendingRoomToken = null;
            if (data.code === "room_full") {
                updateStatus("房间已满（对方可能已断线，约 1 分钟后可重试）", true);
            } else {
                updateStatus("错误: " + (data.message || "未知错误"), true);
            }
        }
    }

    // 重连或凭证过期时，重新向 auth 服务换取进房凭证
    async function rejoinCurrentRoom() {
        if (!currentRoomId) return;
        const res = await Auth.apiFetch('/rooms/' + encodeURIComponent(currentRoomId) + '/join', {
            method: 'POST',
            body: { password: currentRoomPassword || '' },
        });
        if (res.status === 200) {
            currentRoomTitle = res.data.room.title;
            pendingRoomToken = res.data.roomToken;
            pendingRoomTitle = currentRoomTitle;
            sendJoinRoom();
            return;
        }
        // 房间被解散 / 密码变了 / 没权限：清掉本地房间状态
        const c = res.data && res.data.error && res.data.error.code;
        if (c === 'room_not_found') updateStatus("房间已被解散", true);
        else updateStatus(apiErr(res), true);
        resetRoomUI();
    }

    // ========== 结束通话 / 退出房间 ==========

    // 只结束媒体与通话状态，不动房间归属（收到对方 bye 时用）
    function endCall() {
        inCall = false;
        isInitiator = false;
        if (iceRestartTimer) { clearTimeout(iceRestartTimer); iceRestartTimer = null; }

        if (peerConn) {
            peerConn.close();
            peerConn = null;
        }
        audioSender = null;

        $('remoteVideo').srcObject = null;
        $('hangupBtn').disabled = true;
        $('remoteCard').classList.remove('connected');
        document.title = "影音视界 · 房间视频通话";

        // 结束通话不改变本端设备状态，只重置远端的显示
        remoteHasVideo = false;
        remoteVideoMuted = false;
        remoteMicMuted = false;
        remoteMicStarted = false;
        updateRemoteUI();
    }

    // 清空本地房间状态（不动媒体）
    function resetRoomUI() {
        currentRoomId = null;
        currentRoomTitle = '';
        currentRoomPassword = '';
        pendingRoomToken = null;
        pendingRoomTitle = '';
        byeSent = false;
        setRoomStatus(null);
        $('hangupBtn').disabled = true;
        $('leaveBtn').disabled = true;
        $('remoteLabel').textContent = '对方';
        refreshRooms();
    }

    // 挂断：结束通话 + 离开房间（当前产品语义）
    function hangup(isActive) {
        const wasInCall = inCall || !!peerConn;
        if (isActive !== false && !byeSent && currentRoomId &&
            ws && ws.readyState === WebSocket.OPEN && authed) {
            byeSent = true;
            ws.send(JSON.stringify({ type: "bye" }));
        }
        endCall();
        resetRoomUI();
        updateStatus(wasInCall ? "已挂断，已退出房间" : "已退出房间");
    }

    // 退出房间：在房间里但没在通话时使用；通话中则等同挂断
    function leaveRoom() {
        if (inCall || peerConn) {
            hangup(true);
            return;
        }
        if (!byeSent && currentRoomId && ws && ws.readyState === WebSocket.OPEN && authed) {
            byeSent = true;
            ws.send(JSON.stringify({ type: "bye" }));
        }
        endCall();
        resetRoomUI();
        updateStatus("已退出房间");
    }

    // 解散房间：只有创建者能调，二次确认后删除。房间号与加入记录一并消失。
    async function dissolveRoom(room) {
        const msg = '确定解散房间「' + room.title + '」吗？\n\n解散后房间号和所有人的加入记录都会消失，无法恢复。';
        if (!window.confirm(msg)) return;

        // 自己正在这个房间里：先正常退出，让对端收到 bye 而不是被静默掐断
        if (currentRoomId === room.id) {
            leaveRoom();
        }

        const res = await Auth.apiFetch('/rooms/' + encodeURIComponent(room.id), { method: 'DELETE' });

        if (res.status === 204) {
            updateStatus('房间「' + room.title + '」已解散');
            refreshRooms();
            return;
        }

        const code = res.data && res.data.error && res.data.error.code;
        if (code === 'not_owner') {
            updateStatus('只有创建者可以解散房间', true);
        } else if (code === 'room_not_found') {
            updateStatus('房间已经不存在了', true);
            refreshRooms();
        } else {
            updateStatus(apiErr(res), true);
        }
    }

    // ========== Toggle Controls ==========
    function showDeviceError(e, deviceName) {
        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
            updateStatus(`未授权${deviceName}，请在浏览器地址栏的权限设置中允许后重试`, true);
        } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
            updateStatus(`未检测到${deviceName}设备`, true);
        } else if (e.name === 'NotReadableError' || e.name === 'TrackStartError') {
            updateStatus(`${deviceName}被其他应用占用`, true);
        } else {
            updateStatus(`${deviceName}启动失败: ` + e.message, true);
        }
    }

    async function toggleMic() {
        if (!micStarted) {
            // 首次开启：获取设备（会弹一次权限请求），通话中则会触发一次重协商
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                showDeviceError(e, '麦克风');
                return;
            }
            const track = stream.getAudioTracks()[0];
            localStream.addTrack(track);
            micStarted = true;
            audioMuted = false;
            if (peerConn && inCall) {
                audioSender = peerConn.addTrack(track, localStream);
            }
            if (!inCall) updateStatus("麦克风已开启，可创建或加入房间");
        } else {
            audioMuted = !audioMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !audioMuted);
            if (inCall && audioSender) {
                const params = audioSender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings.forEach(encoding => {
                    encoding.active = !audioMuted;
                });
                audioSender.setParameters(params).catch(e => console.error("设置发送器参数失败:", e));
            }
        }
        updateMicUI();
        sendMediaState();
    }

    async function toggleVideo() {
        if (!videoStarted) {
            // 首次开启：获取设备（会弹一次权限请求），通话中则会触发一次重协商
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            } catch (e) {
                showDeviceError(e, '摄像头');
                return;
            }
            const track = stream.getVideoTracks()[0];
            localStream.addTrack(track);
            videoStarted = true;
            videoMuted = false;
            if (peerConn && inCall) {
                peerConn.addTrack(track, localStream);
            }
            if (!inCall) updateStatus("摄像头已开启，可创建或加入房间");
        } else {
            videoMuted = !videoMuted;
            localStream.getVideoTracks().forEach(track => track.enabled = !videoMuted);
        }
        $('localVideo').srcObject = localStream;
        $('localVideo').play().catch(() => {});
        updateVideoUI();
        sendMediaState();
    }

    // ========== WebSocket ==========
    function clearReconnectTimer() {
        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
    }

    // 统一入口：把进房凭证发给信令服务。
    // 注意：房间是否存在、密码对不对，都已经由 auth 服务校验过并签发进房凭证；
    // 信令服务只验签取 roomId，所以这里只需要 roomToken。
    function sendJoinRoom() {
        if (!pendingRoomToken || !authed || !ws || ws.readyState !== WebSocket.OPEN) return false;
        try {
            ws.send(JSON.stringify({ type: "join_room", roomToken: pendingRoomToken }));
        } catch (e) {
            pendingRoomToken = null;
            updateStatus("加入房间失败: " + e.message, true);
            return false;
        }
        updateStatus("正在加入房间...");
        return true;
    }

    // 建连后的第一件事：发送 auth。
    // 服务端要求 5 秒内发出，否则按 auth_timeout 断开。
    function sendAuth() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        if (!Auth.token) {
            // 内存里没有 accessToken：用 httpOnly Cookie 换一个再重试
            updateStatus("正在恢复登录状态…");
            Auth.refresh().then((ok) => {
                if (ok) sendAuth();
                else gotoLogin();
            });
            return;
        }

        try {
            ws.send(JSON.stringify({ type: "auth", token: Auth.token }));
            updateStatus("正在鉴权…");
        } catch (e) {
            updateStatus("鉴权失败: " + e.message, true);
        }
    }

    // 登录态彻底失效：断开并回到登录页（不再重连）
    function gotoLogin() {
        wsDisconnectedIntentionally = true;
        clearReconnectTimer();
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            try { ws.close(1000, "go to login"); } catch (e) { /* 忽略 */ }
        }
        location.replace("login.html");
    }

    // 重连排程：单例定时器，重复触发不会叠加出多个 socket
    function scheduleReconnect() {
        if (wsDisconnectedIntentionally) return;
        if (reconnectTimer) return;                        // 已有重连计划，不重复排程
        if (wsReconnectAttempts >= WS_MAX_RECONNECT) {
            updateStatus("连接已断开，请刷新页面", true);
            return;
        }
        const delay = Math.min(WS_RECONNECT_BASE * Math.pow(2, wsReconnectAttempts), 30000);
        wsReconnectAttempts++;
        updateStatus(`正在重新连接... (${wsReconnectAttempts}/${WS_MAX_RECONNECT})`, true);
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connectWebSocket().catch(() => {});
        }, delay);
    }

    // 建连单飞：同一时刻只允许一条建连流程，重复调用复用同一个 Promise
    function connectWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve();
        if (connectPromise) return connectPromise;

        connectPromise = new Promise((resolve, reject) => {
            const protocol = location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${location.host}/ws`;
            const socket = new WebSocket(wsUrl);
            ws = socket;

            socket.onopen = () => {
                wsDisconnectedIntentionally = false;
                wsReconnectAttempts = 0;
                authed = false;
                clearReconnectTimer();
                console.log("WebSocket 已连接，发送鉴权");
                // 建连后第一件事是鉴权；入房在收到 auth_ok 之后才发
                sendAuth();
                resolve();
            };

            socket.onerror = () => {
                if (wsReconnectAttempts === 0) updateStatus("WebSocket 连接失败", true);
                reject(new Error("WebSocket 连接失败"));
            };

            socket.onmessage = handleSignaling;

            socket.onclose = () => {
                if (ws === socket) ws = null;
                if (wsDisconnectedIntentionally) return;
                // 通话中掉线：只结束媒体（socket 已关闭，发不出 bye）。
                // 注意这里不能调用 hangup()——那会清掉房间状态，
                // 重连回来后就没法自动回房了。
                if (inCall) endCall();
                scheduleReconnect();
            };
        }).finally(() => {
            connectPromise = null;
        });

        return connectPromise;
    }

    // 页面真正离开时主动断开，服务端可立刻通知对端，不必等 TCP 超时
    function closeSocketIntentionally() {
        wsDisconnectedIntentionally = true;
        clearReconnectTimer();
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            try { ws.close(1000, "page unload"); } catch (e) { /* 忽略 */ }
        }
    }

    // ========== Room Operations ==========
    // 房间状态：标题（主）+ 房间号（等宽小字）。两者都没有则显示"未加入房间"。
    function setRoomStatus(title, roomId) {
        const el = $('roomStatus');
        if (!title && !roomId) {
            el.textContent = '未加入房间';
            return;
        }
        el.textContent = title ? (title + '  ') : '当前房间: ';
        if (roomId) {
            const span = document.createElement('span');
            span.className = 'room-id';
            span.textContent = roomId;
            el.appendChild(span);
        }
    }

    // ========== 房间：进入 / 创建 / 加入 / 列表 ==========

    function apiErr(res) {
        const e = res && res.data && res.data.error;
        return (e && e.message) || ('请求失败（HTTP ' + (res ? res.status : '?') + '）');
    }

    // 拿到进房凭证后进入房间
    async function enterRoom(roomToken, title) {
        if (inCall) {
            updateStatus("你正在通话中，请先挂断");
            return;
        }

        pendingRoomToken = roomToken;
        pendingRoomTitle = title || '';
        byeSent = false;
        remoteHasVideo = false;
        remoteVideoMuted = false;
        remoteMicMuted = false;
        remoteMicStarted = false;
        updateRemoteUI();
        setRoomStatus(pendingRoomTitle);

        if (ws && ws.readyState === WebSocket.OPEN && authed) {
            sendJoinRoom();
            return;
        }
        updateStatus("正在连接服务器...");
        try {
            await connectWebSocket();
        } catch (e) {
            pendingRoomToken = null;
            setRoomStatus(null);
            updateStatus("连接服务器失败，请检查网络", true);
        }
    }

    // ---- 创建房间弹窗 ----
    function openCreateModal() {
        $('newTitle').value = '';
        $('newPassword').value = '';
        $('createMsg').textContent = '';
        $('createMask').classList.add('show');
        setTimeout(function () { $('newTitle').focus(); }, 50);
    }
    function closeCreateModal() {
        $('createMask').classList.remove('show');
    }

    async function submitCreateRoom() {
        const title = $('newTitle').value.trim();
        const password = $('newPassword').value.trim();
        if (!title) {
            $('createMsg').textContent = '请填写房间标题';
            return;
        }

        const btn = $('createConfirm');
        btn.disabled = true;
        btn.textContent = '创建中…';

        const res = await Auth.apiFetch('/rooms', {
            method: 'POST',
            body: { title: title, password: password },
        });

        btn.disabled = false;
        btn.textContent = '创建并进入';

        if (res.status === 201) {
            closeCreateModal();
            currentRoomPassword = password;
            currentRoomTitle = res.data.room.title;
            await enterRoom(res.data.roomToken, res.data.room.title);
            refreshRooms();
            return;
        }
        $('createMsg').textContent = apiErr(res);
    }

    // ---- 加入已存在的房间（从列表点进来）----
    async function joinFromList(room) {
        if (inCall) {
            updateStatus("你正在通话中，请先挂断");
            return;
        }
        let password = '';
        if (room.hasPassword) {
            password = await askPassword(room.title);
            if (password === null) return;
        }
        await doJoin(room.id, password);
    }

    // ---- 通过房间号加入 ----
    async function joinByCode(code) {
        if (!/^[A-Z0-9]{4,16}$/.test(code)) {
            updateStatus("房间号格式不对", true);
            return;
        }
        // 先不带密码试一次；如果房间有密码，服务端会回 bad_password
        const res = await Auth.apiFetch('/rooms/' + code + '/join', {
            method: 'POST',
            body: { password: '' },
        });
        if (res.status === 200) {
            currentRoomPassword = '';
            currentRoomTitle = res.data.room.title;
            await enterRoom(res.data.roomToken, res.data.room.title);
            refreshRooms();
            return;
        }
        const c = res.data && res.data.error && res.data.error.code;
        if (c === 'bad_password') {
            const pw = await askPassword(code);
            if (pw === null) return;
            await doJoin(code, pw);
            return;
        }
        if (c === 'room_not_found') {
            updateStatus("房间不存在，请确认房间号", true);
            return;
        }
        if (c === 'too_many_attempts') {
            updateStatus("密码尝试次数过多，请稍后再试", true);
            return;
        }
        updateStatus(apiErr(res), true);
    }

    // 统一的"带密码加入"动作
    async function doJoin(roomId, password) {
        const res = await Auth.apiFetch('/rooms/' + encodeURIComponent(roomId) + '/join', {
            method: 'POST',
            body: { password: password || '' },
        });
        if (res.status === 200) {
            currentRoomPassword = password || '';
            currentRoomTitle = res.data.room.title;
            await enterRoom(res.data.roomToken, res.data.room.title);
            refreshRooms();
            return true;
        }
        const c = res.data && res.data.error && res.data.error.code;
        if (c === 'bad_password') updateStatus("房间密码错误", true);
        else if (c === 'room_not_found') { updateStatus("房间不存在", true); refreshRooms(); }
        else if (c === 'too_many_attempts') updateStatus("密码尝试次数过多，请稍后再试", true);
        else updateStatus(apiErr(res), true);
        return false;
    }

    // ---- 密码输入弹窗（Promise 化）----
    let pwdResolver = null;
    function askPassword(title) {
        $('pwdTitle').textContent = '房间「' + title + '」需要密码';
        $('pwdInput').value = '';
        $('pwdMsg').textContent = '';
        $('pwdMask').classList.add('show');
        setTimeout(function () { $('pwdInput').focus(); }, 50);
        return new Promise(function (resolve) { pwdResolver = resolve; });
    }
    function closePwd(value) {
        $('pwdMask').classList.remove('show');
        const r = pwdResolver;
        pwdResolver = null;
        if (r) r(value);
    }

    // ---- 房间列表 ----
    const roomData = { all: [], mine: [], live: {}, tab: 'active', timer: null };

    async function refreshRooms() {
        if (!Auth.token) return;
        const results = await Promise.all([
            Auth.apiFetch('/rooms'),
            Auth.apiFetch('/rooms/mine'),
        ]);
        if (results[0].status === 200) {
            roomData.all = results[0].data.rooms || [];

            // 我正待着的房间从列表里消失了 = 创建者把它解散了。
            // 列表有条数上限，只有没被截断时才敢下这个结论，免得误判。
            if (currentRoomId && roomData.all.length > 0 && roomData.all.length < 200 &&
                !roomData.all.some(function (r) { return r.id === currentRoomId; })) {
                const gone = currentRoomTitle;
                leaveRoom();
                updateStatus('房间「' + gone + '」已被创建者解散', true);
            }
        }
        if (results[1].status === 200) roomData.mine = results[1].data.rooms || [];

        // 在线人数在信令服务那边，这里顺带问一次
        if (authed && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'list_rooms' }));
        }
        renderRoomList();
    }

    function buildRoomItem(room, peers) {
        const li = document.createElement('li');
        li.className = 'room-item' + (peers > 0 ? ' live' : '');

        const head = document.createElement('div');
        head.className = 'room-item-head';

        const title = document.createElement('span');
        title.className = 'room-item-title';
        title.textContent = room.title;    // 一律 textContent，防 XSS
        head.appendChild(title);

        if (room.hasPassword) {
            const lock = document.createElement('span');
            lock.className = 'room-lock';
            lock.textContent = '🔒';
            head.appendChild(lock);
        }

        // 只有创建者能解散。点 × 不触发外层的"加入房间"
        if (Auth.user && room.ownerId && room.ownerId === Auth.user.id) {
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'room-del';
            del.textContent = '×';
            del.title = '解散房间';
            del.setAttribute('aria-label', '解散房间 ' + room.title);
            del.onclick = function (ev) {
                ev.stopPropagation();
                dissolveRoom(room);
            };
            head.appendChild(del);
        }

        const meta = document.createElement('div');
        meta.className = 'room-item-meta';
        meta.textContent = room.ownerName + ' · ' +
            (peers > 0 ? peers + ' 人在线' : '无人在线') + ' · ' + room.id;

        li.appendChild(head);
        li.appendChild(meta);
        li.onclick = function () { joinFromList(room); };
        return li;
    }

    function renderRoomList() {
        const ul = $('roomList');
        while (ul.firstChild) ul.removeChild(ul.firstChild);

        const list = roomData.tab === 'mine' ? roomData.mine : roomData.all;
        let shown = 0;
        for (let i = 0; i < list.length; i++) {
            const room = list[i];
            const peers = roomData.live[room.id] || 0;
            if (roomData.tab === 'active' && peers === 0) continue;
            ul.appendChild(buildRoomItem(room, peers));
            shown++;
        }

        if (shown === 0) {
            const li = document.createElement('li');
            li.className = 'room-empty';
            li.textContent = roomData.tab === 'active'
                ? '现在没有人在房间里，点右上角「+ 新建」开一个'
                : '你还没加入过任何房间';
            ul.appendChild(li);
        }
    }

    function startRoomPolling() {
        if (roomData.timer) return;
        refreshRooms();
        roomData.timer = setInterval(function () {
            if (!Auth.token) return;
            refreshRooms();
        }, 4000);
    }

    function setRoomTab(tab) {
        roomData.tab = tab;
        $('tabActive').className = 'side-tab' + (tab === 'active' ? ' active' : '');
        $('tabMine').className = 'side-tab' + (tab === 'mine' ? ' active' : '');
        renderRoomList();
    }

    // ========== Init ==========
    window.onload = async () => {
        updateMicUI();
        updateVideoUI();

        // 没有有效登录态就直接回登录页（refresh Cookie 也过期时）
        const loggedIn = await Auth.ensureSession();
        if (!loggedIn) {
            location.replace("login.html");
            return;
        }

        $('userName').textContent = Auth.user
            ? (Auth.user.displayName || Auth.user.username)
            : "已登录";

        updateStatus("点击下方按钮开启摄像头或麦克风");
        await connectWebSocket().catch(() => updateStatus("WebSocket 连接失败", true));
    };

    $('createBtn').onclick = openCreateModal;          // 页面上的「创建房间」按钮
    $('newRoomBtn').onclick = openCreateModal;         // 侧栏的「+ 新建」
    $('createCancel').onclick = closeCreateModal;
    $('createConfirm').onclick = submitCreateRoom;
    $('createMask').onclick = (e) => { if (e.target === $('createMask')) closeCreateModal(); };

    $('pwdCancel').onclick = () => closePwd(null);
    $('pwdConfirm').onclick = () => closePwd($('pwdInput').value.trim());
    $('pwdInput').onkeydown = (e) => { if (e.key === 'Enter') closePwd($('pwdInput').value.trim()); };

    $('joinBtn').onclick = () => {
        const code = $('roomIdInput').value.trim().toUpperCase();
        if (code) joinByCode(code);
        else alert("请输入房间号");
    };
    $('roomIdInput').onkeydown = (e) => {
        if (e.key === 'Enter') $('joinBtn').onclick();
    };

    // 侧栏两个 Tab
    $('tabActive').onclick = () => setRoomTab('active');
    $('tabMine').onclick = () => setRoomTab('mine');

    // 窄屏抽屉
    $('sidebarToggle').onclick = () => $('sidebar').classList.toggle('open');

    $('hangupBtn').onclick = () => hangup(true);
    $('leaveBtn').onclick = leaveRoom;
    $('micBtn').onclick = toggleMic;
    $('videoBtn').onclick = toggleVideo;
    $('logoutBtn').onclick = async () => {
        $('logoutBtn').disabled = true;
        await Auth.logout();
        gotoLogin();
    };

    // 页面真正离开时主动断开（进入 bfcache 时 persisted=true，不能关，否则返回页面会留下死连接）
    window.addEventListener('pagehide', (e) => {
        if (!e.persisted) closeSocketIntentionally();
    });
</script>
</body>
</html>
