# WebRTC 视频通话 —— nginx 主配置
#
# 部署到：/etc/nginx/nginx.conf（deploy/install.sh 会自动备份原文件）
#
# 注意这里刻意**只保留全局设置**，所有 server 块放在 sites-available/webrtc 里。
# 老版本把 server 块直接写死在 nginx.conf 里，导致：
#   * sites-enabled 下的站点完全不生效（没有 include）；
#   * 想换站点只能改主配置，容易误伤。
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;          # 不回显版本号
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 上传体积：本项目只有 JSON 信令，8MB 足够且能挡住异常大包
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 站点（每个站点一个文件）----------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
