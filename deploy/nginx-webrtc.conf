# WebRTC 视频通话 —— nginx 站点配置
#
# 部署到：/etc/nginx/sites-available/webrtc
# 启用：  ln -s /etc/nginx/sites-available/webrtc /etc/nginx/sites-enabled/webrtc
#
# 为什么必须是 HTTPS（不是"更安全"这种泛泛的理由）：
#   浏览器的 getUserMedia（拿摄像头/麦克风）只在 **安全上下文** 里可用，
#   而安全上下文 = https:// 或 http://localhost。用 http:// + 局域网 IP 打开，
#   navigator.mediaDevices 直接是 undefined，页面根本拿不到设备。
#   所以哪怕只是内网演示，也必须上 HTTPS（自签证书即可，浏览器点"继续前往"）。

# HTTP 一律跳 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 证书告警页放行：让 .well-known 之类还能用（可选）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # 刻意不开 HTTP/2：
    #   1) `http2 on;` 是 nginx 1.25.1+ 的新写法，1.18~1.24（Ubuntu 24.04 自带 1.24）
    #      会直接报 unknown directive；老写法 `listen 443 ssl http2;` 又在 1.25+ 被标记废弃，
    #      没有一种写法能同时干净地兼容两端。
    #   2) WebSocket 走的是 HTTP/1.1 Upgrade，开 HTTP/2 对本站毫无收益。
    # 以后要开：确认 nginx -v ≥ 1.25.1 后加一行 `http2 on;` 即可。

    server_name _;      # 自签证书，用 IP 直接访问，不挑 Host

    ssl_certificate     /etc/nginx/ssl/webrtc.crt;
    ssl_certificate_key /etc/nginx/ssl/webrtc.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 前端静态文件 ----------
    root /opt/webrtc/static;
    index index.html;

    # 登录态判断在 JS 里做：没登录跳 /login.html
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 认证服务（Go，127.0.0.1:8080）----------
    # 注意：proxy_pass 末尾不要加斜杠，否则 /api/login 会被改写成 /login
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 信令（C++/muduo，127.0.0.1:8888 的 WebSocket）----------
    location /ws {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 一通电话可能聊很久，别让 nginx 60 秒就掐断空闲连接。
        # 服务端自己有 30 秒 ping/60 秒回收逻辑，这里给足余量。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
